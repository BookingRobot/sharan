<!doctype html>
<!-- Nuorodos peržiūros paveikslėlio (og-sharanos-timeline.png, 1200x630) šaltinis.
     Atnaujinus: atidaryti naršyklėje 1200x630 lange ir padaryti ekrano nuotrauką į og-sharanos-timeline.png. -->
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Sharanos timeline: nuorodos paveikslėlis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Inter:wght@500..700&amp;display=swap">
<style>
html,body{margin:0;background:#0E1430}
svg{display:block}
text{font-family:'Inter',system-ui,sans-serif;font-weight:500}
.bf{font-family:'Bricolage Grotesque','Arial Black',sans-serif;font-weight:800}
.cc{font-size:22px;font-weight:700;fill:#F4F1EA}
.t1{font-size:124px;letter-spacing:-.035em;fill:#F7C948}
.t2{font-size:124px;letter-spacing:-.035em;fill:#F4F1EA}
.sub{font-size:31px;fill:#9FA7C6}
.bub{font-size:28px;letter-spacing:.02em;fill:#0E1430}
.ic{fill:none;stroke:#9FA7C6;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rail{fill:none;stroke:#7D86AC;stroke-width:5;stroke-linecap:round}
.seam{fill:none;stroke:rgba(0,0,0,.2);stroke-width:2.5;stroke-linecap:round}
.handle{fill:none;stroke:rgba(0,0,0,.35);stroke-width:4;stroke-linecap:round}
.glare{fill:none;stroke:rgba(255,255,255,.2);stroke-width:3;stroke-linecap:round}
.speed{fill:none;stroke:#F4F1EA;stroke-width:4;stroke-linecap:round;opacity:.35}
.spoke{fill:none;stroke:#8189AD;stroke-width:2.5;stroke-linecap:round}
</style>
</head>
<body>
